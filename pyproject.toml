[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "basketball-knowledge-miner"
version = "0.1.0"
description = "Public zero-cost basketball knowledge collector for Hooper's Hub / FormPath"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.11,<3",
  "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4",
  "ruff>=0.12",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
