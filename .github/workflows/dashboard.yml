name: Miner Live Dashboard

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  workflow_call:
    secrets:
      HOOPHUB_MINER_TOKEN:
        required: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: miner-live-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Checkout safe Miner state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: miner-state
          path: _miner_state
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v6.0.0
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install .
      - name: Assemble public site
        run: |
          mkdir -p _site
          cp dashboard/index.html dashboard/app.js dashboard/styles.css _site/
      - name: Build aggregate status
        env:
          HOOPHUB_MINER_TOKEN: ${{ secrets.HOOPHUB_MINER_TOKEN }}
        run: |
          python scripts/build_dashboard_status.py \
            --collection-state _miner_state/state/collection_stats.json \
            --output _site/status.json
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
