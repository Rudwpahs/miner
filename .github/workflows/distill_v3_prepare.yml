name: FormPath Distillation V3 Prepare

on:
  schedule:
    - cron: "42 * * * *"
  workflow_dispatch:
    inputs:
      write_shadow:
        description: "Persist prepared state under the private V3 shadow root"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: formpath-distillation-v3-prepare
  cancel-in-progress: false

jobs:
  prepare-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v6.0.0
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install .
      - name: Prepare V3 shadow state
        env:
          HOOPHUB_MINER_TOKEN: ${{ secrets.HOOPHUB_MINER_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          WRITE_SHADOW: ${{ inputs.write_shadow }}
        run: |
          RUN_DATE="$(TZ=Asia/Seoul date +%F)"
          if [ "$EVENT_NAME" = "schedule" ] || [ "$WRITE_SHADOW" = "true" ]; then
            python scripts/run_distill_v3_prepare.py --repo Rudwpahs/hoopDB --branch main --run-date "$RUN_DATE" --write-shadow
          else
            python scripts/run_distill_v3_prepare.py --repo Rudwpahs/hoopDB --branch main --run-date "$RUN_DATE" --dry-run
          fi
