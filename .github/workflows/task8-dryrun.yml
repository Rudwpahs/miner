name: Task 8 Collector Dry Run

on:
  push:
    branches: [main]
    paths:
      - ".github/TASK8_DRYRUN_TRIGGER"

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v6.0.0
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install .
      - name: Load safe state
        run: |
          mkdir -p _state_current
          git fetch --depth=1 origin miner-state
          git show FETCH_HEAD:state/crossref.json > _state_current/crossref.json
          git show FETCH_HEAD:state/youtube_rss.json > _state_current/youtube_rss.json
          git show FETCH_HEAD:state/seen_hashes.jsonl > _state_current/seen_hashes.jsonl
      - name: Diagnose adapters by counts only
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from basketball_miner.sources.crossref import CrossrefAdapter
          from basketball_miner.sources.youtube_rss import YouTubeRssAdapter, load_channel_ids
          from basketball_miner.state import load_checkpoint

          state = Path("_state_current")
          adapters = [
              ("crossref", CrossrefAdapter(), load_checkpoint(state / "crossref.json", "crossref")),
              ("youtube_rss", YouTubeRssAdapter(load_channel_ids(Path("config/youtube_channels.json"))), load_checkpoint(state / "youtube_rss.json", "youtube_rss")),
          ]
          for name, adapter, checkpoint in adapters:
              batch = adapter.fetch(checkpoint, 50)
              print(json.dumps({"adapter": name, "records": len(batch.records), "errors": batch.error_count, "rate_limited": batch.rate_limited}, sort_keys=True))
          PY
      - name: Run real collector dry-run
        run: python scripts/run_miner.py --budget 500 --state-dir _state_current --no-export
